        IdFrmAcao:
          type: array
          items:
            type: integer
        CdAcao:
          type: array
          items:
            type: string

    RequisicoesDetalhesVM:
      type: object
      description: |
        Detalhes completos de uma requisição. Retornado diretamente (sem envelope RetornoApiRest).
        O campo Conjuntos é um dicionário (não array): chave = nome da seção, valor = campos com valores.
        Em erro de acesso, só `MensagensErro` vem preenchido e `Conjuntos` é nulo (HTTP 200).
      properties:
        Conjuntos:
          type: object
          nullable: true
          description: |
            Dados da requisição organizados por seção. Estrutura:
            `{ "Detalhes Do Pedido": { "Assunto": "...", "Status": "...", "Anexos": [ ... ] }, "Agendamento do Pedido": { ... }, "Participantes": { ... }, "IdsParticipantes": { "REG": { "IdTipoPapel": 1, "IdParticipante": 123 } } }`
          additionalProperties: true
