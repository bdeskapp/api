        Solicitados:
          type: array
          items:
            $ref: '#/components/schemas/FiltroParticipante'
        Responsaveis:
          type: array
          items:
            $ref: '#/components/schemas/FiltroParticipante'
        Beneficiados:
          type: array
          items:
            $ref: '#/components/schemas/FiltroParticipante'
        Registradores:
          type: array
          items:
            $ref: '#/components/schemas/FiltroParticipante'
        ICs:
