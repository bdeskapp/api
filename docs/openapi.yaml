    VMExecutarAcaoApi:
      type: object
      description: Dados para execução de uma ação de workflow. Consulte `GET .../acoes` para saber os campos de cada ação.
      required: [Id]
      properties:
        Id:
          type: string
          description: |
            Identificador da ação **com o código entre colchetes**: `"[ENC]"` ou `"Encerrar [ENC]"`
            (ação de usuário: `[USU<n>]`). `"ENC"` sozinho resulta em "Ação não encontrada" (HTTP 200).
            Use o `Id` devolvido por `GET .../acoes`.
          example: "Encerrar [ENC]"
        Descricao:
          type: string
          description: Descrição/comentário da ação
        prioridade:
          type: integer
          format: int16
          nullable: true
          description: Nova prioridade (ALTPRI; 1 Alta, 2 Média, 3 Baixa)
        ConjuntosDadosAdicionais:
          type: object
          description: Dados adicionais para atualizar junto com a ação (um nível; cada conjunto vira o item "1")
          additionalProperties:
            type: object
            additionalProperties: true
        IdRequisicaoAVincular:
          type: integer
          nullable: true
          description: ID da requisição a vincular (usado com VINC)
        Data:
          type: string
          description: Data/hora informada (aceita por `DateTime.TryParse`); inválida resulta em "Data inválida" (HTTP 200)
        Motivo:
          type: integer
          format: int16
          nullable: true
          description: ID do motivo (obrigatório se a ação tem motivos)
        NovoSolicitado:
          type: string
          description: Para DIR, o `Id` de `GET .../acoes/DIR/grupos`
        DescricaoRequisicao:
          type: string
          description: Nova descrição da requisição (usado com ALTDES)
        AssuntoRequisicao:
          type: string
          description: Novo assunto (usado com ALTDES)
        AtividadeId:
          type: integer
          nullable: true
          description: Nova atividade (usado com RECAT)
        GrupoId:
          type: integer
          nullable: true
          description: Novo grupo de atendimento (usado com DIR)
        DataFimPrevisto:
          type: string
          description: Nova data de fim previsto
        ManterGrupo:
          type: boolean
          nullable: true
          description: Se deve manter o grupo atual (usado com DIR)
        tipoAvaliacao:
          type: integer
          nullable: true
          description: Avaliação para ENC/AVAL (1 acima, 2 conforme, 3 abaixo do esperado)
        usuResponsavelId:
          type: integer
          format: int64
          nullable: true
          description: Responsável para ATR/ATRR (veja `GET .../acoes/{codigoAcao}/usuarios-responsaveis`)

    VMAbrirRequisicao:
      type: object
      description: |
        Dados para abertura de requisição.
        O campo `Formulario` é o ID do formulário (não confundir com IdFormulario).
        Os dados do formulário são passados via `Conjuntos`, um dicionário
        cujas chaves são os nomes dos conjuntos e os valores são os campos preenchidos.
      required: [Formulario]
      properties:
        Formulario:
          type: integer
          description: ID do formulário (FormularioId)
        Conjuntos:
          type: object
          description: |
            Dados do formulário organizados por conjunto.
            Chave: nome do conjunto (ex. "DadosBasicos").
            Valor: objeto com chave do campo → valor preenchido.
          additionalProperties: true

    DesdobrarRequisicaoVM:
      type: object
      description: Dados para desdobramento de requisição. Herda de VMAbrirRequisicao.
      allOf:
        - $ref: '#/components/schemas/VMAbrirRequisicao'
        - type: object
          properties:
            IdRequisicaoADesdobrar:
              type: integer
              nullable: true
              description: ID da requisição original a ser desdobrada

    UploadVM:
      type: object
      description: |
        Resposta do passo 1 do anexo (`POST .../anexo` ou `POST /v1/requisicoes/Upload`). Objeto cru,
        sem envelope. **`Id` é uma string (GUID)**, não um inteiro: identifica o arquivo na pasta
        temporária e só serve para `POST .../anexos/submeter` (ou para abrir requisição com anexo).
        Não é o id do documento.
      properties:
        Id:
          type: string
          description: GUID do arquivo temporário (vazio em falha)
        MensagensErro:
          type: array
          items:
            type: string

