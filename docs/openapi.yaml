openapi: 3.1.0
info:
  title: API BDesk
  description: |
    # API de Gerenciamento de Serviços BDesk

    API REST para integração com a plataforma BDesk (BusinessDesk), um sistema ITSM/service-desk empresarial.

    ## Principais recursos

    * **Requisições**: Abrir, consultar, filtrar e executar ações em requisições de serviço
    * **Itens de Configuração (ICs)**: Consultar ativos, componentes, associações e listas de papéis
    * **Catálogo de Serviços**: Navegar formulários, atividades e itens de seleção
    * **Autenticação**: Autenticação via bearer token

    ## Autenticação

    Todos os endpoints (exceto login) requerem autenticação via bearer token no cabeçalho
    `Authorization: Bearer <access_token>`. O token é obtido via `POST /v1/login/entrar`.

    O servidor **não expira** o bearer token: ele vale enquanto o usuário estiver ativo. Cabeçalho
    ausente, esquema diferente de Bearer, token desconhecido ou usuário inativo resultam em
    HTTP 401 sem corpo. O campo `expires_in` devolvido no login é apenas informativo.

    > **Atenção:** O endpoint de login retorna `RetornoApi<T>` (não `RetornoApiRest<T>`).
    > O campo `Dados` contém uma **string JSON escapada** — é necessário fazer `JSON.parse(response.Dados)` para extrair o token.

    ## Formato de Resposta

    Muitos endpoints usam o envelope `RetornoApiRest<T>`:
    ```json
    {
      "_metadata": { "Release": "...", "MensagensErro": [], "LogAmigavel": [] },
      "records": [ ... ]
    }
    ```

    Nem todos os endpoints usam esse envelope: vários devolvem um array, um objeto, uma string
    ou um arquivo cru, e alguns envelopes trazem um `_metadata` parcial (sem `Release`, ou vazio).
    O formato exato de cada operação está descrito na própria operação.

    ## Erros de negócio

    Os erros de negócio **não** seguem um padrão único. Há dois comportamentos e o cliente deve
    tratar os dois:

    1. **HTTP 406 com corpo em texto puro.** Quando o método chama `LevantarExcessaoSeHouverMensagensErro()`,
       a resposta é HTTP 406 (`ReasonPhrase` "Critical Exception") e o corpo é `text/plain`, com as
       mensagens separadas por quebra de linha. O corpo **não é JSON** e não tem `_metadata`.
    2. **HTTP 200 com a mensagem no corpo.** Em vários endpoints o erro volta com status 200 e o
       cliente só descobre a falha lendo o corpo: `login/entrar` e `login/EntrarApp`
       (`MensagensErro` preenchido e `Dados` nulo), `GET requisicoes/{requisicao}`
       (`MensagensErro` preenchido e `Conjuntos` nulo), `POST requisicoes/{requisicao}/acoes`
       (`_metadata.MensagensErro`), `POST requisicoes/responderpesquisasatisfacao`
       (string que começa com `erro:`), entre outros. Cada operação diz qual dos dois vale para ela.

    Outros status relevantes: HTTP 401 (sem token válido), HTTP 404, que tende a ocorrer quando um
    parâmetro de query obrigatório, sem valor padrão, é omitido (seleção de ação do Web API, "No
    action was found", antes de o código rodar; não verificado em execução) e HTTP 500 em exceção
    não tratada.
  version: 2.0.0
  contact:
    email: suporte@bdesk.com.br
    name: Suporte BDesk
    url: https://herocorp.bdesk.com.br

servers:
  - url: https://{cliente}.bdesk.com.br/askrest
    description: Produção
    variables:
      cliente:
        default: sua-empresa
        description: Subdomínio do cliente
  - url: https://{cliente}.bdesk.com.br/askrest-qa
    description: QA / Homologação
    variables:
      cliente:
        default: sua-empresa
  - url: https://{cliente}.bdesk.com.br/askrest-dev
    description: Desenvolvimento
    variables:
      cliente:
        default: sua-empresa
  - url: http://localhost:{porta}/api
    description: Desenvolvimento local
    variables:
      porta:
        default: "44378"

security:
  - bearerAuth: []

tags:
  - name: Usuários e Autenticação
    description: Login, dados do usuário autenticado
  - name: Requisições
    description: Abertura, consulta, ações, histórico e anexos de requisições
  - name: Catálogo
    description: Catálogo de serviços (formulários, atividades, itens de seleção)
  - name: Configuração
    description: Itens de configuração (ICs), consultas dinâmicas e listas de papéis

# ============================================================================
# PATHS
# ============================================================================

paths:

  # --------------------------------------------------------------------------
  # Usuários e Autenticação — LoginController, UsuariosController
  # --------------------------------------------------------------------------

  /v1/login/entrar:
    post:
      tags: [Usuários e Autenticação]
      summary: Autenticar usuário
      description: |
        Autentica um usuário com login e senha nativos e retorna um bearer token.

        > **Atenção:** Este endpoint usa `RetornoApi<T>` (não `RetornoApiRest<T>`).
        > O campo `Dados` contém uma **string JSON escapada**. É necessário fazer
        > `JSON.parse(response.Dados)` para extrair o objeto com `access_token`.

        **Falhas de login não usam 406.** Toda falha volta com **HTTP 200**, `Dados` nulo e a
        mensagem em `MensagensErro`. O cliente deve checar `MensagensErro` (ou `Dados == null`)
        antes de tentar ler o token. Casos: ambiente sem login nativo habilitado, licença
        inválida, login ou senha incorretos, usuário de sistema (id 1), captcha ativo no
        ambiente (o parâmetro `USAR_CAPTCHA` torna este endpoint inutilizável) e qualquer
        `Dominio` preenchido ("Não é possível efetuar login na APIRest com esse tipo de
        usuário"). Na prática, só login nativo (`Dominio` vazio) emite token.

        O servidor **não aplica expiração** ao bearer: o token vale enquanto o usuário estiver
        ativo. O `expires_in` do token é um carimbo Unix absoluto (segundos desde 1970 UTC,
        em string) apenas informativo. Usuário inativo recebe 401 nas chamadas seguintes.
      operationId: entrar
      security: []
      x-source-controller: LoginController.Entrar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            Resposta do login. Em sucesso, `Dados` é uma string JSON com o token e
            `MensagensErro` é vazio. Em falha, `Dados` é nulo e `MensagensErro` traz o motivo
            (o status continua 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiLogin'
              examples:
                sucesso:
                  summary: Login bem-sucedido
                  value:
                    Dados: '{"access_token":"eyJhbGci...","token_type":"bearer","expires_in":"1799999999","refresh_token":null,"scope":"admin","error":null}'
                    LogAmigavel: []
                    MensagensErro: []
                    Versao: null
                falha:
                  summary: Credenciais inválidas (HTTP 200, sem token)
                  value:
                    Dados: null
                    LogAmigavel: []
                    MensagensErro: ["Login ou senha incorretos"]
                    Versao: null

  /v1/login/EntrarApp:
    post:
      tags: [Usuários e Autenticação]
      summary: Autenticar via app (token temporário)
      description: |
        Troca um token temporário (emitido pelo portal MVC, válido por 10 minutos e de uso
        único) por um bearer token. O token temporário é apagado antes de o bearer ser emitido.

        Aqui `Dados` é um **objeto** de verdade (`{"access_token": "..."}`), diferente de
        `login/entrar`, em que `Dados` é uma string JSON.

        **Falhas não usam 406.** Toda falha volta com **HTTP 200**, `Dados` nulo e a mensagem em
        `MensagensErro`: JSON inválido, "Token inválido ou expirado" (token desconhecido, de outro
        tipo ou vencido) e "Token inválido". O servidor não aplica expiração ao bearer emitido.
      operationId: entrarApp
      security: []
      x-source-controller: LoginController.EntrarApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_token]
              properties:
                access_token:
                  type: string
                  description: Token temporário emitido pelo portal MVC
      responses:
        '200':
          description: |
            Bearer token emitido (`Dados.access_token`) ou falha (`Dados` nulo e
            `MensagensErro` preenchido, com o mesmo status 200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiObject'
              examples:
                sucesso:
                  summary: Token trocado
                  value:
                    Dados: { access_token: "eyJhbGci..." }
                    LogAmigavel: []
                    MensagensErro: []
                    Versao: "9.8.0"
                falha:
                  summary: Token temporário vencido (HTTP 200, sem token)
                  value:
                    Dados: null
                    LogAmigavel: []
                    MensagensErro: ["Token inválido ou expirado"]
                    Versao: "9.8.0"

  /v1/usuarios/alterar-senha:
    post:
      tags: [Usuários e Autenticação]
      summary: Alterar a senha do usuário autenticado
      description: |
        Altera a senha do usuário dono do token. A senha atual é validada contra o login do
        usuário, então só vale para usuários de **login nativo** (banco). A regra de força da nova
        senha vem do parâmetro avançado `REGRA_FORTE_SENHA_BANCO`.

        Erros de negócio voltam como **HTTP 406 em texto puro**, uma mensagem por linha:
        "Dados não informados", "Usuário não encontrado", "Senha atual incorreta", cada razão de
        senha fraca e falhas ao gravar.
      operationId: alterarSenha
      x-source-controller: UsuariosController.AlterarSenha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarSenhaApiVM'
      responses:
        '200':
          description: Senha alterada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestSucesso'
              example:
                _metadata: { Release: "9.8.0", LogAmigavel: [], MensagensErro: [] }
                records:
                  - Sucesso: true
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/usuarios/me:
    get:
      tags: [Usuários e Autenticação]
      summary: Dados básicos do usuário autenticado
      description: |
        Retorna dados básicos do usuário autenticado (login, id, nome).

        > **Nota:** Este endpoint retorna um objeto direto (sem envelope `RetornoApiRest`) e
        > os nomes dos campos são PascalCase (`Login`, `Id`, `Nome`).
      operationId: dadosUsuarioAutenticado
      x-source-controller: UsuariosController.DadosUsuarioAutenticado
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioVM'
              example:
                Login: "joao.silva"
                Id: 123
                Nome: "João Silva"
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/usuarios/perfil:
    get:
      tags: [Usuários e Autenticação]
      summary: Perfil detalhado do usuário autenticado
      description: |
        Retorna perfil completo com empresa, cargo, superiores hierárquicos e dados de contato.
        Os campos opcionais voltam `null`.

        Se o usuário do token não for encontrado, a resposta é **HTTP 200** com `records` vazio e
        a mensagem "Usuário não encontrado" em `_metadata.MensagensErro` (sem 406).
      operationId: detalhesDadosUsuarioAutenticado
      x-source-controller: UsuariosController.DetalhesDadosUsuarioAutenticado
      responses:
        '200':
          description: Perfil detalhado (um único record)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestPerfilUsuario'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  # --------------------------------------------------------------------------
  # Requisições — RequisicoesController
  # --------------------------------------------------------------------------

  /v1/requisicoes:
    get:
      tags: [Requisições]
      summary: Dashboard de requisições
      description: |
        Retorna contadores de requisições abertas e encerradas com URLs de navegação.

        Atenção: os contadores `Abertas` e `Encerradas` são o **total do ambiente (tenant)**, sem
        filtro pelo usuário autenticado. A resposta é um objeto cru, sem `_metadata`.
        O código tem duas ações (`Dashboard` e `Painel`) nesta mesma URL, com corpo idêntico; para o
        cliente é um único endpoint.
      operationId: dashboard
      x-source-controller: RequisicoesController.Dashboard
      responses:
        '200':
          description: Resumo do dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
              example:
                Abertas: 1523
                Encerradas: 88211
                UrlRequisicoesAbertas: "https://sua-empresa.bdesk.com.br/askrest/v1/requisicoes/abertas"
                UrlRequisicoesEncerradas: "https://sua-empresa.bdesk.com.br/askrest/v1/requisicoes/encerradas"
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/requisicoes/abertas:
    get:
      tags: [Requisições]
      summary: Listar requisições abertas
      description: |
        Retorna as requisições abertas a que o usuário tem acesso, filtradas pelos parâmetros de
        query (os mesmos campos de `FiltrosRequisicoes`, sem prefixo).

        **Não há paginação.** Não existem `pageSize`, `pageNumber` nem `_metadata.Pagination`. O
        único limitador é `LimiteRequisicoes` (padrão **500**, vira `SELECT TOP n`). O filtro
        `DadosAdicionais` só é prático via `POST`. Lista vazia é HTTP 200 com `records: []`.

        O `_metadata` desta resposta tem apenas `MensagensErro` e `LogAmigavel` (sem `Release`).
        `DescricaoRequisicao` pode vir com entidades HTML (`&#231;`); decodifique no cliente.
      operationId: requisicoesAbertas
      x-source-controller: RequisicoesController.RequisicoesAbertas
      parameters:
        - $ref: '#/components/parameters/FiltroRequisicaoId'
        - $ref: '#/components/parameters/FiltroAtividadeId'
        - $ref: '#/components/parameters/FiltroAtividadesIds'
        - $ref: '#/components/parameters/FiltroNomeAtividade'
        - $ref: '#/components/parameters/FiltroNomeFormulario'
        - $ref: '#/components/parameters/FiltroDescricoesStatus'
        - $ref: '#/components/parameters/FiltroGruposSolucionadores'
        - $ref: '#/components/parameters/FiltroIdsFormularios'
        - $ref: '#/components/parameters/FiltroAssunto'
        - $ref: '#/components/parameters/FiltroAbertoEntreInicio'
        - $ref: '#/components/parameters/FiltroAbertoEntreFim'
        - $ref: '#/components/parameters/FiltroEncerradoEntreInicio'
        - $ref: '#/components/parameters/FiltroEncerradoEntreFim'
        - $ref: '#/components/parameters/FiltroLimiteRequisicoes'
      responses:
        '200':
          description: Lista de requisições abertas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestRequisicoes'
              example:
                _metadata: { MensagensErro: [], LogAmigavel: [] }
                records:
                  - RequisicaoId: 222885
                    Assunto: "Teste"
                    Status: "Aberta"
                    UrlDetalhesRequisicao: "https://sua-empresa.bdesk.com.br/askrest/v1/requisicoes/222885"
        '401':
          $ref: '#/components/responses/NaoAutorizado'
    post:
      tags: [Requisições]
      summary: Listar requisições abertas (filtro POST)
      description: |
        Variante POST com os filtros no corpo (inclui `DadosAdicionais`). Resposta igual à do GET.
        Sem paginação: o limitador é `LimiteRequisicoes` (padrão 500). O corpo `{}` é válido.

        JSON malformado resulta em HTTP 406 em texto puro. Corpo literal `null` resulta em
        HTTP 500 (NullReferenceException).
      operationId: requisicoesAbertasPost
      x-source-controller: RequisicoesController.RequisicoesAbertasPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiltrosRequisicoes'
            example:
              DescricoesStatus: ["Aberta"]
              LimiteRequisicoes: 50
              AbertoEntre: { Inicio: "2026-01-01T00:00:00", Fim: "2026-01-31T23:59:59" }
      responses:
        '200':
          description: Lista de requisições abertas filtradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestRequisicoes'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/encerradas:
    get:
      tags: [Requisições]
      summary: Listar requisições encerradas
      description: |
        Retorna as requisições encerradas a que o usuário tem acesso. Aceita os mesmos parâmetros
        de `GET /v1/requisicoes/abertas`; `EncerradoEntre` só faz sentido aqui.

        **Não há paginação**: o limitador é `LimiteRequisicoes` (padrão 500).
      operationId: requisicoesEncerradas
      x-source-controller: RequisicoesController.RequisicoesEncerradas
      parameters:
        - $ref: '#/components/parameters/FiltroRequisicaoId'
        - $ref: '#/components/parameters/FiltroAtividadeId'
        - $ref: '#/components/parameters/FiltroAtividadesIds'
        - $ref: '#/components/parameters/FiltroNomeAtividade'
        - $ref: '#/components/parameters/FiltroNomeFormulario'
        - $ref: '#/components/parameters/FiltroDescricoesStatus'
        - $ref: '#/components/parameters/FiltroGruposSolucionadores'
        - $ref: '#/components/parameters/FiltroIdsFormularios'
        - $ref: '#/components/parameters/FiltroAssunto'
        - $ref: '#/components/parameters/FiltroAbertoEntreInicio'
        - $ref: '#/components/parameters/FiltroAbertoEntreFim'
        - $ref: '#/components/parameters/FiltroEncerradoEntreInicio'
        - $ref: '#/components/parameters/FiltroEncerradoEntreFim'
        - $ref: '#/components/parameters/FiltroLimiteRequisicoes'
      responses:
        '200':
          description: Lista de requisições encerradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestRequisicoes'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
    post:
      tags: [Requisições]
      summary: Listar requisições encerradas (filtro POST)
      description: |
        Variante POST com os filtros no corpo. Resposta igual à do GET. JSON malformado resulta em
        HTTP 406 em texto puro; corpo literal `null` resulta em HTTP 500.
      operationId: requisicoesEncerradasPost
      x-source-controller: RequisicoesController.RequisicoesEncerradasPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiltrosRequisicoes'
      responses:
        '200':
          description: Lista de requisições encerradas filtradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestRequisicoes'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/porcondicao/{condicao}/{quantidade}:
    post:
      tags: [Requisições]
      summary: Requisições por condição
      description: |
        Retorna as requisições do usuário em uma condição de atendimento (contexto "Atendo"),
        ordenadas por `RequisicaoId` decrescente, no formato de lista de requisições. Alguns campos
        que a lista tradicional traz podem vir `null`.

        `condicao` é repassada à procedure `uspRequisicoesAtendimento` e vale uma de: `Abertas`,
        `Assumidas`, `Aprovacao`, `Congeladas`, `Acompanhar`, `Solicitei`, `Avaliar`, `Encerradas`.
        Uma condição desconhecida não é validada: devolve HTTP 200 com `records: []`.

        No corpo, `Ids` **não tem efeito**; só `DescricaoOuAssunto` filtra. Envie ao menos `{}`:
        corpo ausente ou `null` resulta em HTTP 500. A descrição pode vir com entidades HTML.
      operationId: obterRequisicoesByCondicao
      x-source-controller: RequisicoesController.ObterRequisicoesByCondicao
      parameters:
        - name: condicao
          in: path
          required: true
          schema:
            type: string
            enum: [Abertas, Assumidas, Aprovacao, Congeladas, Acompanhar, Solicitei, Avaliar, Encerradas]
          description: Condição de atendimento
        - name: quantidade
          in: path
          required: true
          schema:
            type: integer
          description: Quantidade máxima de resultados
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiltrosRequisicoesSimples'
      responses:
        '200':
          description: Requisições filtradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestRequisicoes'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/requisicoes/busca:
    post:
      tags: [Requisições]
      summary: Busca avançada de requisições
      description: |
        Pesquisa avançada de requisições (abertas e encerradas) com filtros complexos. A rota é
        `busca` (não `buscar`).

        A resposta é um **array JSON cru** de `RequisicaoSumario`, sem `_metadata` e sem `records`.
        Um cliente que espera `records` quebra. Sucesso nunca devolve `MensagensErro`.

        `UltimaAcaoExecutada_Id` precisa do código entre colchetes (ex. `Encerrar [ENC]`). Em
        `DadosAdicionais`, dado do tipo domínio usa `Valor`; dado do tipo texto usa `ValorParcial`;
        outro tipo, ou o campo errado, gera erro. Um dado adicional sem `Valor` e sem `ValorParcial`
        é ignorado em silêncio.

        Erros são **HTTP 406 em texto puro**: "JSON informado como null", "Ação não encontrada,
        inativa ou sem acesso", "Id não informado para o dado adicional de índice #i",
        "Dado não encontrado: id" e "Busca pelo campo 'Valor' (ou 'ValorParcial') não implementada
        para o tipo de dados ...".
      operationId: buscaRequisicoes
      x-source-controller: RequisicoesController.BuscaRequisicoes
      parameters:
        - name: maximoPorSituacao
          in: query
          required: false
          schema:
            type: integer
            default: 100
          description: Máximo de resultados por situação (aberta e encerrada)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VMFiltrosRequisicoesAvancado'
            example:
              Assunto: "fibra"
              AbertasDesde: "2026-01-01"
              Solicitantes:
                - { Participante: 10, TipoPapel: 1 }
      responses:
        '200':
          description: Array cru de resumos de requisição
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequisicaoSumario'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/{requisicao}:
    get:
      tags: [Requisições]
      summary: Detalhes da requisição
      description: |
        Retorna detalhes completos de uma requisição com dados organizados em conjuntos e URLs de
        navegação. A resposta é um DTO cru (sem `_metadata`/`records`).

        **Este endpoint nunca devolve 406.** Requisição inexistente ou sem acesso (os dois casos
        são indistinguíveis) volta com **HTTP 200**, `Conjuntos` nulo e a mensagem
        "Requisição inexistente ou usuário sem acesso" em `MensagensErro`. O cliente deve testar
        `MensagensErro` e `Conjuntos == null`; o status não muda. Exceção interna resulta em 500.

        Os conjuntos fixos são "Detalhes Do Pedido" (inclui `Anexos`), "Agendamento do Pedido",
        "Participantes" e "IdsParticipantes", mais um conjunto por conjunto de dados adicionais.
        `Tempos` traz os tempos da requisição em minutos.
      operationId: detalhes
      x-source-controller: RequisicoesController.Detalhes
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
      responses:
        '200':
          description: Detalhes da requisição, ou erro de acesso em `MensagensErro` (status 200 nos dois casos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisicoesDetalhesVM'
              examples:
                sucesso:
                  summary: Requisição encontrada
                  value:
                    Conjuntos:
                      "Detalhes Do Pedido": { Assunto: "Teste", Status: "Aberta" }
                    UrlDadosAdicionais: "https://sua-empresa.bdesk.com.br/askrest/v1/requisicoes/222885/dadosadicionais"
                    MensagensErro: []
                semAcesso:
                  summary: Inexistente ou sem acesso (HTTP 200)
                  value:
                    Conjuntos: null
                    MensagensErro: ["Requisição inexistente ou usuário sem acesso"]
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/requisicoes/{requisicao}/dado-dominio-detalhado:
    get:
      tags: [Requisições]
      summary: Detalhes com dados de domínio
      description: |
        Mesmo `RequisicoesDetalhesVM` de `GET /v1/requisicoes/{requisicao}`, com os dados de
        domínio detalhados. A diferença está só nos conjuntos de dados adicionais: campos de data
        trazem o valor bruto em vez do texto formatado, e campos de lista (ListBox) trazem
        `[{ "Id", "Texto" }]` em vez de array de textos. Use quando o cliente precisa dos ids dos
        itens selecionados para reenviar em `POST /v1/requisicoes/{requisicao}/dadosadicionais`.

        Os erros são os mesmos: HTTP 200 com `MensagensErro` (sem 406).
      operationId: detalhesRequisicaoDadoDominio
      x-source-controller: RequisicoesController.DetalhesRequisicaoDadoDominio
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
      responses:
        '200':
          description: Detalhes com domínio, ou erro de acesso em `MensagensErro`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisicoesDetalhesVM'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/requisicoes/{requisicao}/historico:
    get:
      tags: [Requisições]
      summary: Histórico da requisição
      description: |
        Retorna todo o histórico de ações e eventos da requisição visível ao usuário. Para filtrar
        por ação use o `POST`. O campo `DataIncio` (sem "c") é o nome real no código.

        Requisição inexistente ou sem acesso resulta em **HTTP 406 em texto puro**.
      operationId: historico
      x-source-controller: RequisicoesController.Historico
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
      responses:
        '200':
          description: Histórico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestGenerico'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'
    post:
      tags: [Requisições]
      summary: Histórico filtrado
      description: |
        Retorna o histórico filtrado por ação. O corpo é **opcional**: corpo vazio ou `null`
        equivale a sem filtro (igual ao GET). O acesso é verificado antes de o corpo ser lido.

        Requisição inexistente ou sem acesso, e JSON malformado, resultam em HTTP 406 em texto puro.
      operationId: historicoPost
      x-source-controller: RequisicoesController.HistoricoPost
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiltrosHistorico'
            example:
              CdAcao: ["ENC", "DIR"]
      responses:
        '200':
          description: Histórico filtrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestGenerico'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/{requisicao}/anexos:
    get:
      tags: [Requisições]
      summary: Listar anexos
      description: |
        Lista os anexos **já gravados** na requisição (resultado de `anexo` + `anexos/submeter`,
        ou de ações). Nota — rota usa plural `/anexos`. O `Id` aqui é o inteiro `idDoc`, usado em
        `GET /v1/requisicoes/{requisicao}/anexos/{idDoc}`; não confundir com o `Id` GUID do upload.

        O `_metadata` desta resposta só tem `MensagensErro`. Requisição inexistente ou sem acesso
        resulta em HTTP 406 em texto puro.
      operationId: anexos
      x-source-controller: RequisicoesController.Anexos
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
      responses:
        '200':
          description: Lista de anexos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestAnexos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/{requisicao}/anexos/{idDoc}:
    get:
      tags: [Requisições]
      summary: Baixar anexo
      description: |
        Baixa o arquivo de um anexo. A resposta é o **binário** do arquivo (não JSON, sem
        envelope), com `Content-Type` deduzido da extensão e
        `Content-Disposition: attachment; filename=<nome físico>`. O arquivo é lido por inteiro em
        memória (sem streaming).

        Erros são **HTTP 406 em texto puro**: "Requisição inexistente ou usuário sem acesso",
        "Documento não encontrado na base de dados ou usuário sem acesso", "Data de abertura da
        requisição centralizadora não encontrada" e "Arquivo não encontrado" (registro existe, mas o
        arquivo não está no disco). Falha de leitura do disco resulta em 500.
      operationId: baixarAnexo
      x-source-controller: RequisicoesController.BaixarAnexo
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
        - name: idDoc
          in: path
          required: true
          schema:
            type: integer
          description: Id do documento (campo `Id` de `GET /v1/requisicoes/{requisicao}/anexos`)
      responses:
        '200':
          description: Arquivo do anexo
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/{requisicao}/anexo:
    post:
      tags: [Requisições]
      summary: Enviar arquivo (passo 1 de 2 para anexar)
      description: |
        **Este é o passo 1 de 2.** O arquivo é apenas gravado em uma pasta temporária do servidor e
        a requisição **não muda**: nada fica anexado e `GET /v1/requisicoes/{requisicao}/anexos` não
        se altera. A resposta HTTP 200 com `Id` **não prova** que o anexo existe na requisição.

        Para concluir, chame o passo 2, `POST /v1/requisicoes/{requisicao}/anexos/submeter`,
        enviando o `Id` devolvido aqui, o nome do arquivo com extensão e o título.

        Detalhes: nota — rota usa singular `/anexo` (o GET usa `/anexos`). Só o **primeiro** arquivo
        do multipart é lido (o nome do campo não importa e o nome original não é usado). O `Id` é uma
        **string** (GUID, sem extensão), não um inteiro. Esta rota não valida extensão nem nome;
        isso acontece no passo 2.

        Erros: requisição inexistente ou sem acesso resulta em HTTP 406 em texto puro. Falha ao
        gravar (pasta temporária inexistente ou sem permissão) volta com **HTTP 200**, `Id` vazio
        e a mensagem em `MensagensErro`. Multipart sem arquivo resulta em HTTP 500.
      operationId: anexo
      x-source-controller: RequisicoesController.Anexo
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Arquivo gravado na pasta temporária (ou falha indicada em `MensagensErro`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadVM'
              example:
                Id: "3f2c9a1e-5b7d-4c1a-9e0f-2a6d8b4c1e77"
                MensagensErro: []
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/Upload:
    post:
      tags: [Requisições]
      summary: Enviar arquivo avulso (sem requisição na URL)
      description: |
        Mesma lógica de `POST /v1/requisicoes/{requisicao}/anexo`, **sem** verificar uma requisição
        (não há requisição na URL). O arquivo vai para a pasta temporária e o `Id` (string GUID)
        devolvido serve para abrir uma requisição com anexo e para
        `POST /v1/requisicoes/{requisicao}/anexos/submeter`. Só o primeiro arquivo do multipart é
        lido. Multipart sem arquivo resulta em HTTP 500; falha ao gravar volta com HTTP 200 e a
        mensagem em `MensagensErro`.
      operationId: upload
      x-source-controller: RequisicoesController.Upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Arquivo gravado na pasta temporária
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadVM'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/requisicoes/{requisicao}/anexos/submeter:
    post:
      tags: [Requisições]
      summary: Anexar arquivos já enviados (passo 2 de 2)
      description: |
        **Passo 2 de 2.** Só aqui o documento é criado na requisição. Para cada item de `Anexos`
        o servidor valida a requisição e a permissão da ação (`CodigoAcao`, normalmente `ANDOC`) no
        status atual, grava o documento (público, versão 1) e move o arquivo da pasta temporária para
        a pasta de anexos com o nome `{idReq com 8 dígitos}_001_{NomeDuranteUpload}`.

        Fluxo: (1) `POST /v1/requisicoes/{requisicao}/anexo` para cada arquivo, guardando o `Id`
        (GUID); (2) este endpoint com todos os `Id` no mesmo `Anexos`. O `{requisicao}` da URL
        sobrescreve `IdRequisicao` do corpo. Para anexar documento **não** use
        `POST /v1/requisicoes/{requisicao}/acoes`.

        Sucesso: HTTP 200 com `records: null` e `_metadata.MensagensErro` vazio. Confira o resultado em
        `GET /v1/requisicoes/{requisicao}/anexos`.

        Erros em **HTTP 406 em texto puro**: "Caractere não permitido no nome do arquivo" (quebra de
        linha, tab, nulo, barra ou barra invertida), "Extensão não permitida: .ext" (exe, js, html,
        bat, dll e outras; extensão vazia também é recusada), "Requisição N não encontrada.", ação
        `ANDOC` inexistente no formulário, "Usuário sem permissão de anexar documento neste status" e
        falha do componente de gravação. Corpo `null`, `Anexos` ausente ou `NomeDuranteUpload` nulo
        resultam em HTTP 500, assim como um `Id` que não existe na pasta temporária (nada é gravado).
      operationId: submeterAnexos
      x-source-controller: RequisicoesController.SubmeterAnexos
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VMSubmissao'
            example:
              CodigoAcao: "ANDOC"
              Anexos:
                - Id: "3f2c9a1e-5b7d-4c1a-9e0f-2a6d8b4c1e77"
                  NomeDuranteUpload: "relatorio.pdf"
                  Titulo: "Relatório de março"
      responses:
        '200':
          description: Anexos gravados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestGenerico'
              example:
                _metadata: { Release: "9.8.0", LogAmigavel: [], MensagensErro: [] }
                records: null
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /v1/requisicoes/{requisicao}/acoes:
    get:
      tags: [Requisições]
      summary: Ações disponíveis
      description: |
        Lista as ações disponíveis para o usuário autenticado na requisição, no status atual.
        Consulte antes de executar uma ação: o `Id` de cada item é exatamente o valor aceito no campo
        `Id` de `POST /v1/requisicoes/{requisicao}/acoes` (por exemplo `Encerrar [ENC]`) e `Campos`
        descreve o que enviar (`Chave` é o nome do campo no corpo da execução). O `_metadata` vem
        vazio (`{}`). "ANDOC" aparece aqui se o formulário permite, mas o anexo de arquivo segue o
        fluxo `anexo` + `anexos/submeter`.

        Requisição inexistente ou sem acesso resulta em HTTP 406 em texto puro.
      operationId: acoesDoUsuarioNaRequisicao
      x-source-controller: RequisicoesController.AcoesDoUsuarioNaRequisicao
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
      responses:
        '200':
          description: Ações disponíveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestAcoes'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'
    post:
      tags: [Requisições]
      summary: Executar ação
      description: |
        Executa uma ação de workflow na requisição.
        Ver [Guia de Ações de Workflow](guides/workflow-actions.md) para códigos e parâmetros.

        O campo `Id` **precisa conter o código da ação entre colchetes**: `"[ENC]"` ou
        `"Encerrar [ENC]"` (ação de usuário: `[USU<n>]`). `"ENC"` sozinho resulta em
        "Ação não encontrada" (com HTTP 200). Use o `Id` devolvido por `GET .../acoes`.

        **Quase todo erro volta com HTTP 200**, na forma `_metadata.MensagensErro`: "Ação não
        informada. Preencha o campo 'Id'.", "Data inválida", "Ação não encontrada", usuário sem
        permissão na ação neste status e erros do serviço. Esta rota **não** chama a verificação de
        erros depois de executar. Só dois casos dão 406 em texto puro: requisição sem acesso e corpo
        `null` ("ação não informada").

        A resposta 200 tem duas formas: (a) envelope `RetornoApiRest` com `records: null`; (b) se o
        serviço devolve um texto, esse texto cru como string JSON. O cliente deve tratar as duas.
      operationId: executarAcao
      x-source-controller: RequisicoesController.ExecutarAcao
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VMExecutarAcaoApi'
            example:
              Id: "Encerrar [ENC]"
              Descricao: "Resolvido"
              tipoAvaliacao: 2
      responses:
        '200':
          description: |
            Ação executada, ou erro de negócio em `_metadata.MensagensErro` (o status é 200 nos dois
            casos). Pode ser o envelope ou uma string.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RetornoApiRestGenerico'
                  - type: string
              examples:
                sucesso:
                  summary: Ação sem texto de retorno
                  value:
                    _metadata: { Release: "9.8.0", LogAmigavel: [], MensagensErro: [] }
                    records: null
                erro:
                  summary: Ação não encontrada (HTTP 200)
                  value:
                    _metadata: { Release: "9.8.0", LogAmigavel: [], MensagensErro: ["Ação não encontrada"] }
                    records: null
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/{requisicao}/acoes/DIR/grupos:
    get:
      tags: [Requisições]
      summary: Grupos disponíveis para direcionar
      description: |
        Lista os grupos e usuários possíveis como destino da ação `DIR` (Direcionar). Cada `Id` é uma
        string pronta para usar em `NovoSolicitado` de `POST .../acoes`, inclusive com o espaço final
        (`"{ IdParticipante : 12, IdTipoPapel : 2 } "`). O `_metadata` vem vazio (`{}`).

        Requisição inexistente ou sem acesso resulta em HTTP 406 em texto puro.
      operationId: possiveisSolicitadosAcaoDirecionar
      x-source-controller: RequisicoesController.PossiveisSolicitadosAcaoDirecionar
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
      responses:
        '200':
          description: Grupos disponíveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestValor'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/{requisicao}/acoes/{codigoAcao}/usuarios-responsaveis:
    get:
      tags: [Requisições]
      summary: Usuários responsáveis para atribuição
      description: |
        Lista os usuários que podem receber a atribuição nas ações `ATR` e `ATRR`. Use o `Id` devolvido
        como `usuResponsavelId` em `POST .../acoes`. O `formularioId` correto vem na URL
        `Opcoes.Url` do campo "Responsável" de `GET .../acoes`.

        Para `codigoAcao = ATR` a lista vem de `UsuariosResponsaveisParaAtribuicao`; para **qualquer
        outro** código (na prática `ATRR`) vem do papel `RESP` do formulário (o código não valida o
        valor). O `_metadata` vem vazio (`{}`). Requisição inexistente ou sem acesso resulta em
        HTTP 406 em texto puro.
      operationId: usuariosResponsaveisAtribuicao
      x-source-controller: RequisicoesController.UsuariosResponsaveisAtribuicao
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
        - name: codigoAcao
          in: path
          required: true
          schema:
            type: string
            enum: [ATR, ATRR]
          description: Código da ação
        - name: formularioId
          in: query
          required: true
          schema:
            type: integer
          description: Id do formulário da requisição. Sem ele pode responder 404 (seleção de ação do Web API)
      responses:
        '200':
          description: Usuários responsáveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestGenerico'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/{requisicao}/dadosadicionais:
    get:
      tags: [Requisições]
      summary: Dados adicionais da requisição
      description: |
        Retorna a estrutura dos conjuntos de dados adicionais da requisição (definição dos campos e
        valores atuais). É a estrutura usada para montar a edição; as chaves de campo daqui são as
        usadas em `POST` na mesma rota. Para o formato achatado chave-valor use
        `GET /v1/requisicoes/{requisicao}`.

        O controller não levanta 406: requisição inexistente ou sem acesso volta com **HTTP 200**,
        `ConjuntosDadosAdicionais` nulo e a mensagem em `MensagensErro`.
      operationId: dadosAdicionais
      x-source-controller: RequisicoesController.DadosAdicionais
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
      responses:
        '200':
          description: Dados adicionais, ou erro de acesso em `MensagensErro`
          content:
            application/json:
              schema:
                type: object
                properties:
                  ConjuntosDadosAdicionais:
                    type: array
                    nullable: true
                    items:
                      $ref: '#/components/schemas/ConjuntoCampos'
                  MensagensErro:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/NaoAutorizado'
    post:
      tags: [Requisições]
      summary: Editar dados adicionais
      description: |
        Atualiza dados adicionais da requisição. Corpo: `{ "<nome do conjunto>": { "<chave do campo>": valor } }`;
        cada conjunto vira um único item, então conjuntos com vários itens não são editáveis por
        esta rota. As chaves vêm de `GET` na mesma rota. Com o header `Debug: RetornarJson` nada é
        gravado.

        A resposta 200 é uma **string JSON crua** (texto devolvido pelo componente; vazio quando não há
        mensagem), não um objeto nem envelope. **Não há como distinguir sucesso de falha pelo status**:
        o componente pode devolver a mensagem de erro na própria string. Releia
        `GET .../dadosadicionais` para confirmar a gravação.

        Sem acesso à requisição e JSON malformado resultam em HTTP 406 em texto puro; corpo `null`
        resulta em 406 sem corpo.
      operationId: editarDadosAdicionais
      x-source-controller: RequisicoesController.EditarDadosAdicionais
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
        - $ref: '#/components/parameters/DebugRetornarJson'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
                additionalProperties: true
              description: 'Mapa de conjuntos → campos → valores'
            example:
              "Detalhes Do Pedido": { DAObservacao: "texto" }
      responses:
        '200':
          description: Texto de retorno do componente (string JSON crua)
          content:
            application/json:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/{requisicao}/tarefas:
    get:
      tags: [Requisições]
      summary: Tarefas da requisição
      description: |
        Lista as tarefas simples da requisição, com os dados básicos de cada tarefa (os campos exatos
        são os da classe de retorno do componente). `{requisicao}` aqui é `long`.

        O controller **não verifica o acesso** à requisição; a restrição fica a cargo do componente.
        Falhas aparecem em `_metadata.MensagensErro` com HTTP 200, ou HTTP 500 se a chamada lançar
        exceção.
      operationId: tarefasDaRequisicao
      x-source-controller: RequisicoesController.Tarefas
      parameters:
        - name: requisicao
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID da requisição
      responses:
        '200':
          description: Tarefas da requisição
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestGenerico'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/requisicoes/{requisicao}/vinculadas:
    get:
      tags: [Requisições]
      summary: Requisições vinculadas
      description: |
        Retorna as requisições vinculadas. O `_metadata` vem vazio (`{}`), sem `Release`,
        `LogAmigavel` nem `MensagensErro`. Requisição inexistente ou sem acesso resulta em HTTP 406
        em texto puro.
      operationId: requisicoesVinculadas
      x-source-controller: RequisicoesController.RequisicoesVinculadas
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
      responses:
        '200':
          description: Requisições vinculadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestVinculadas'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/{requisicao}/pesquisasatisfacao:
    get:
      tags: [Requisições]
      summary: Pesquisa de satisfação
      description: |
        Retorna a pesquisa de satisfação aplicável à requisição (DTO cru, sem envelope). Sem pesquisa
        aplicável, `PossuiPesquisa` é `false` e `Perguntas` é nulo. Os ids das perguntas e das
        respostas possíveis alimentam `POST /v1/requisicoes/responderpesquisasatisfacao`.

        Requisição inexistente ou sem acesso resulta em HTTP 406 em texto puro.
      operationId: pesquisaSatisfacao
      x-source-controller: RequisicoesController.PesquisaSatisfacao
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
      responses:
        '200':
          description: Dados da pesquisa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PesquisaVM'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/responderpesquisasatisfacao:
    post:
      tags: [Requisições]
      summary: Responder pesquisa de satisfação
      description: |
        Submete a resposta de uma pesquisa de satisfação (registrada executando a ação `ENC`, `AVAL`
        ou `PESQ` disponível ao usuário na requisição).

        **Esta rota não usa 406.** Falhas de negócio voltam como **HTTP 200** com uma string que começa
        com `erro:` (por exemplo `"erro: acesso negado"`, também para requisição inexistente, ou
        `"erro: acesso negado, não há uma ação 'PESQ', 'ENC' ou 'AVAL' não disponível"`). O cliente
        deve tratar uma string iniciada por `erro:` como falha.
      operationId: responderPesquisaSatisfacao
      x-source-controller: RequisicoesController.ResponderPesquisaSatisfacao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PesquisaRespondida'
            example:
              IdRequisicao: 222885
              Respostas:
                - { IdPergunta: 3, IdOpcao: 12 }
      responses:
        '200':
          description: String crua do componente; começa com `erro:` em caso de falha
          content:
            application/json:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/requisicoes/pesquisas-pendentes:
    get:
      tags: [Requisições]
      summary: Pesquisas de satisfação pendentes
      description: |
        Lista as pesquisas de satisfação ainda não respondidas pelo usuário autenticado. Use
        `IdRequisicao` em `GET /v1/requisicoes/{requisicao}/pesquisasatisfacao`. Sem pendências:
        HTTP 200 com `records: []`. Não há erro de negócio.
      operationId: pesquisasPendentes
      x-source-controller: RequisicoesController.PesquisasPendentes
      responses:
        '200':
          description: Pesquisas pendentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestPesquisasPendentes'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  # --- Abertura de Requisições ---

  /v1/requisicoes/abrir:
    post:
      tags: [Requisições]
      summary: Abrir requisição (retorno simples)
      description: |
        Cria uma nova requisição e retorna **apenas o número** da requisição criada, como string JSON
        crua (sem envelope), por exemplo `"222886"`.

        Cada conjunto de `Conjuntos` é um objeto (um item) ou um array de objetos (vários itens).
        Conjuntos usuais: `DadosBasicos` (`Assunto`, `Descricao`, `Atividade`), `Papeis` (por exemplo
        `ANTE`, `ADO` como `{ "IdParticipante": n, "IdTipoPapel": 1 }`) e os conjuntos de dados
        adicionais do formulário.

        Erros (formulário inexistente, validação de campo — "O campo 'Conjunto.Campo' recebeu a
        seguinte mensagem de validação: ...", erros do serviço, corpo nulo) são **HTTP 406 em texto
        puro**. **Atenção:** o 406 é lançado *depois* de a abertura ser tentada; mensagens acumuladas
        após a criação ainda geram 406, então a requisição pode ter sido criada mesmo com a falha.

        Com o header `Debug: RetornarJson` nada é aberto e a rota responde 406 com o JSON recebido.
      operationId: abrirRequisicao
      x-source-controller: RequisicoesController.AbrirRequisicao
      parameters:
        - $ref: '#/components/parameters/DebugRetornarJson'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VMAbrirRequisicao'
            example:
              Formulario: 68
              Conjuntos:
                DadosBasicos: { Assunto: "Teste", Descricao: "Descrição" }
      responses:
        '200':
          description: Número da requisição criada
          content:
            application/json:
              schema:
                type: string
              example: "222886"
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/abrirRequisicao:
    post:
      tags: [Requisições]
      summary: Abrir requisição (retorno completo)
      description: |
        Igual a `POST /v1/requisicoes/abrir`, mas o número da requisição vem dentro do envelope
        `RetornoApiRest`, em `records[0].IdRequisicaoAberta` (como **string**). `records` vem vazio se
        a abertura não devolveu um id.

        Erros são **HTTP 406 em texto puro**, com a mesma ressalva de `abrir`: a checagem acontece
        depois da tentativa de abertura. Aceita o header `Debug: RetornarJson`.
      operationId: abrirRequisicaoRetornoCompleto
      x-source-controller: RequisicoesController.AbrirRequisicaoRetornoCompleto
      parameters:
        - $ref: '#/components/parameters/DebugRetornarJson'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VMAbrirRequisicao'
      responses:
        '200':
          description: Requisição criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestRequisicaoAberta'
              example:
                _metadata: { Release: "9.8.0", LogAmigavel: [], MensagensErro: [] }
                records:
                  - IdRequisicaoAberta: "222886"
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/desdobrar:
    post:
      tags: [Requisições]
      summary: Desdobrar requisição
      description: |
        Cria uma nova requisição a partir de uma existente (desdobramento). `IdRequisicaoADesdobrar`
        identifica a requisição-mãe. A resposta é o resultado do serviço (id da nova requisição) como
        string JSON crua, sem envelope.

        Erros são **HTTP 406 em texto puro** (formulário inexistente, "É preciso informar o campo
        IdRequisicaoADesdobrar", erros do desdobramento), verificados *depois* da execução. Corpo
        nulo resulta em HTTP 500.
      operationId: desdobrarRequisicao
      x-source-controller: RequisicoesController.DesdobrarRequisicao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesdobrarRequisicaoVM'
      responses:
        '200':
          description: ID da nova requisição
          content:
            application/json:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  # --- Abertura Formato-Específico (Integrações) ---

  /v1/requisicoes/abrirFormatoZabbix:
    post:
      tags: [Requisições]
      summary: Abrir requisição (formato Zabbix, variante padrão)
      description: |
        Mesma operação de `POST /v1/requisicoes/abrirFormatoZabbix/{variante}` **sem** o segmento
        `{variante}`: usa a variante padrão `RompimentoFibra`. Oculto do Swagger. Veja a descrição da
        rota com `{variante}` para o corpo, a resposta e os erros.
      operationId: abrirRequisicaoFormatoZabbixDefault
      x-source-controller: RequisicoesController.AbrirRequisicaoFormatoZabbix
      parameters:
        - $ref: '#/components/parameters/DebugRetornarJson'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Requisição criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestGenerico'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/abrirFormatoZabbix/{variante}:
    post:
      tags: [Requisições]
      summary: Abrir requisição (formato Zabbix, por variante)
      description: |
        Abre uma requisição a partir de um alerta do Zabbix. Esta é a **única rota** para todas as
        integrações desse tipo: as "variantes" (RompimentoFibra, AtenuaçãoPON, SaturaçãoPON,
        UplinkGPON, TaxaDeErro, SBC e outras) são chaves de configuração em `ParametroAvancado`
        (`IntegracaoZabbix/<variante>`). As rotas antigas `abrirFormato*` por variante (POP, Massiva,
        SBCs, Trechos, Interconexões, Retificadoras, IncidentesIP, AnaliseIncidentesIP,
        InvestigacaoSaturacao, ZabbixDiscart) **não existem mais**; use esta. Oculto do Swagger.

        O corpo é JSON livre: o formato é definido pelo template da variante. Cada campo listado em
        `CamposObrigatorios` da configuração precisa existir no payload (comparação sem diferenciar
        maiúsculas). Exemplo: `{"olt":"OLT-01","hostName":"olt01","problem_id":"123",
        "HorarioQueda":"2026-10-08 10:00:00","PosicoesAfetadas":[{"Slot":"1","Pon":"2"}]}` (os campos
        exigidos dependem da variante).

        Resposta 200: `records[0]` é o id da requisição aberta (string); com ações automáticas, os
        itens seguintes são strings "Retorno da ação <id>: ..." e as mensagens delas se somam em
        `_metadata.MensagensErro` (200). Com `AcoesAutomaticasAssincronas = true` as ações rodam depois
        e o resultado só aparece em log, nunca na resposta. Com `Debug: RetornarJson` nada é gravado e
        `records` traz o `VMAbrirRequisicao` montado.

        Erros em **HTTP 406 em texto puro** (não o envelope JSON): chave de configuração inexistente,
        "JSON não informado", "Campo obrigatório '<x>' não informado no JSON recebido", template ou
        conjunto ausente, lookup de domínio sem correspondência e validações do formulário.
      operationId: abrirRequisicaoFormatoZabbix
      x-source-controller: RequisicoesController.AbrirRequisicaoFormatoZabbix
      parameters:
        - name: variante
          in: path
          required: true
          schema:
            type: string
          description: Variante do formato Zabbix (ex. "RompimentoFibra"); corresponde à chave `IntegracaoZabbix/<variante>`
        - $ref: '#/components/parameters/DebugRetornarJson'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Requisição criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestGenerico'
              example:
                _metadata: { Release: "9.8.0", LogAmigavel: [], MensagensErro: [] }
                records: ["222886"]
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/requisicoes/{requisicao}/atualizarFormatoZabbix/{variante}:
    post:
      tags: [Requisições]
      summary: Atualizar requisição (formato Zabbix)
      description: |
        Atualiza uma requisição existente a partir de um novo alerta do Zabbix. Escreve na requisição:
        executa as `AcoesAutomaticas` e depois cada ação de `TemplatesAcao` (mesmo caminho de
        `POST .../acoes`). Configuração: `ParametroAvancado` chave `IntegracaoZabbixAtualizar/<variante>`.
        Oculto do Swagger.

        O corpo é JSON livre. Na prática `qtd_afetado` é obrigatório (ausente causa HTTP 500 quando o
        template usa `%AFETADOS%`). Esta rota **não** tem modo `Debug`.

        Resposta 200: `records` é uma lista de strings: primeiro os retornos das ações automáticas
        ("Retorno da ação X: ..."), depois, para cada item de `TemplatesAcao`, "Retorno da ação '<Id>':"
        seguido do texto devolvido. Falha em uma ação individual **não** gera 406: aparece em `records`
        ou em `_metadata.MensagensErro` com HTTP 200.

        Sem acesso à requisição, JSON inválido e chave de configuração inexistente resultam em
        HTTP 406 em texto puro.
      operationId: atualizarFormatoZabbix
      x-source-controller: RequisicoesController.AtualizarFormatoZabbix
      parameters:
        - $ref: '#/components/parameters/RequisicaoId'
        - name: variante
          in: path
          required: true
          schema:
            type: string
          description: Variante; corresponde à chave `IntegracaoZabbixAtualizar/<variante>`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Retorno das ações executadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestString'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  # --- Participantes (endpoints de busca) ---

  /v1/participantes/{formularioPapelId}/pesquisar/{termo}:
    get:
      tags: [Requisições]
      summary: Pesquisar participantes por termo
      description: |
        Pesquisa participantes por vínculo formulário-papel e termo de busca no nome (máximo de 100
        itens). Retorna **array cru** (sem envelope). O `Id` de cada item é uma **string que contém
        JSON** (`{"IdParticipante":123,"IdTipoPapel":2}`), pronta para ser enviada como valor do
        participante na abertura de requisição. `Legenda` e `IdDominioPai` vêm sempre `null`.
      operationId: pesquisar
      x-source-controller: ParticipantesController.Pesquisar
      parameters:
        - name: formularioPapelId
          in: path
          required: true
          schema:
            type: integer
          description: ID do vínculo formulário-papel
        - name: termo
          in: path
          required: true
          schema:
            type: string
          description: Termo de pesquisa (texto no nome)
      responses:
        '200':
          description: Participantes encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Valor'
              example:
                - Id: '{"IdParticipante":123,"IdTipoPapel":2}'
                  Texto: "Maria Silva"
                  Legenda: null
                  IdDominioPai: null
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/participantes/ObterParticipantes2:
    get:
      tags: [Requisições]
      summary: Pesquisar participantes (v2)
      description: |
        Mesma busca de `pesquisar`, por query string e com resposta no envelope `RetornoApiRest`
        (máximo de 100 itens; formato de `Id` igual). `formularioPapelId` ou `termo` ausentes podem
        responder 404 (seleção de ação do Web API).
      operationId: obterParticipantes2
      x-source-controller: ParticipantesController.ObterParticipantes2
      parameters:
        - name: formularioPapelId
          in: query
          required: true
          schema:
            type: integer
        - name: termo
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Participantes encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestValor'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/participantes/ObterParticipantesDominio:
    get:
      tags: [Requisições]
      summary: Pesquisar participantes de domínio
      description: |
        Pesquisa participantes dentro do domínio permitido ao usuário autenticado (máximo de 100
        itens). Atenção: o parâmetro aqui se chama `term` (nas outras rotas é `termo`). O código trata
        `term` nulo como texto vazio, mas como não tem valor padrão o Web API tende a exigi-lo: sem ele, pode responder 404 (seleção de ação do Web API).
      operationId: obterParticipantesDominio
      x-source-controller: ParticipantesController.ObterParticipantesDominio
      parameters:
        - name: idFormularioPapel
          in: query
          required: true
          schema:
            type: integer
        - name: term
          in: query
          required: true
          schema:
            type: string
          description: Termo de pesquisa (pode ser vazio, mas o parâmetro precisa estar na URL)
      responses:
        '200':
          description: Participantes de domínio encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestValor'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/participantes/ObterParticipantesParaDependenciaSEARCH:
    get:
      tags: [Requisições]
      summary: Pesquisar participantes para dependência (busca)
      description: |
        Lista os participantes relacionados ao participante pai escolhido (campo dependente de outro).
        Sem filtro por texto. Os cinco parâmetros são obrigatórios (ausente: pode responder 404, seleção de ação do Web API). `jsonPai` é um
        JSON `int[][]` URL-encoded (por exemplo `[[2,123]]`); só o primeiro par é usado, e dele só o
        índice 1 (id do participante pai). `jsonPai` inválido pode resultar em HTTP 500.
      operationId: obterParticipantesParaDependenciaSEARCH
      x-source-controller: ParticipantesController.ObterParticipantesParaDependenciaSEARCH
      parameters:
        - name: idFrmPapel
          in: query
          required: true
          schema:
            type: integer
        - name: idFrmPapelRelacionado
          in: query
          required: true
          schema:
            type: integer
        - name: idTpPapel
          in: query
          required: true
          schema:
            type: integer
        - name: idTpPapelRelacionado
          in: query
          required: true
          schema:
            type: integer
        - name: jsonPai
          in: query
          required: true
          schema:
            type: string
          description: JSON `int[][]` do participante pai, URL-encoded (ex. `[[2,123]]`)
      responses:
        '200':
          description: Participantes para dependência
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestValor'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/participantes/ObterParticipantesParaDependenciaCOMBO:
    get:
      tags: [Requisições]
      summary: Pesquisar participantes para dependência (combo)
      description: |
        Pesquisa participantes para combos dependentes, filtrando por prefixo do nome (`term`, sem
        diferenciar maiúsculas) depois de buscar tudo no componente. `jsonPai` é um JSON `int[][]`
        com pares `[idTipoPapel, idParticipantePai]`. Os três parâmetros são obrigatórios na prática
        (ausente: pode responder 404, seleção de ação do Web API; `term` não tem valor padrão).

        Vínculo formulário-papel inexistente, ou sem papel relacionado, volta com **HTTP 200**,
        `records` vazio e a mensagem em `_metadata.MensagensErro` (sem 406).
      operationId: obterParticipantesParaDependenciaCOMBO
      x-source-controller: ParticipantesController.ObterParticipantesParaDependenciaCOMBO
      parameters:
        - name: idFormularioPapel
          in: query
          required: true
          schema:
            type: integer
        - name: jsonPai
          in: query
          required: true
          schema:
            type: string
          description: JSON `int[][]` com pares `[idTipoPapel, idParticipantePai]`, URL-encoded
        - name: term
          in: query
          required: true
          schema:
            type: string
          description: Prefixo do nome (pode ser vazio, mas o parâmetro precisa estar na URL)
      responses:
        '200':
          description: Participantes para combo, ou erro em `_metadata.MensagensErro` (status 200)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestValor'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  # --------------------------------------------------------------------------
  # Catálogo — CardapioController, ItensSelecaoController
  # --------------------------------------------------------------------------

  /v1/cardapio:
    get:
      tags: [Catálogo]
      summary: Listar áreas do catálogo
      description: |
        Retorna as áreas e os formulários que o usuário pode abrir. O `_metadata` é montado à mão e só
        traz `Release`; `LogAmigavel` e `MensagensErro` saem `null` (diferente da maioria das rotas).
      operationId: areas
      x-source-controller: CardapioController.Areas
      responses:
        '200':
          description: Áreas do catálogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestAreaVM'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/cardapio/{id}:
    get:
      tags: [Catálogo]
      summary: Item do catálogo
      description: |
        Retorna o formulário de abertura de um item do catálogo (conjuntos mesclados, regras e
        condições). É a rota que o portal usa para montar o formulário; preserva o campo `Apresentacao`
        dos campos. A resposta é um objeto cru; `MensagensErro` e `LogAmigavel` são chaves do próprio
        objeto, não de `_metadata`.

        **Erros não usam 406 nem 403.** Item inexistente ou mensagens acumuladas voltam com
        **HTTP 200** e o corpo reduzido a `{ LogAmigavel, MensagensErro }`, sem as demais chaves. O
        cliente detecta a falha pela ausência de `Formulario` ou por `MensagensErro` não vazio.
      operationId: itemCardapio
      x-source-controller: CardapioController.ItemCardapio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID do item do catálogo
      responses:
        '200':
          description: Formulário do item, ou erro em `MensagensErro` (status 200 nos dois casos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCardapioVM'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/cardapio/{id}/planilha/{chaveConjunto}:
    get:
      tags: [Catálogo]
      summary: Baixar planilha-modelo de um conjunto
      description: |
        Devolve a planilha-modelo (XLSX) para preencher um conjunto de múltiplos itens. A resposta é o
        binário do arquivo, com
        `Content-Disposition: attachment; filename=planilha-modelo-conjunto<chaveConjunto>.xlsx`.
        O preenchimento volta pelo `POST` da mesma rota. Erros do serviço resultam em HTTP 406 em texto
        puro.
      operationId: downloadPlanilha
      x-source-controller: CardapioController.DownloadPlanilha
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID do item de cardápio
        - name: chaveConjunto
          in: path
          required: true
          schema:
            type: string
          description: Chave do conjunto de dados adicionais
      responses:
        '200':
          description: Arquivo XLSX
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'
    post:
      tags: [Catálogo]
      summary: Enviar planilha preenchida de um conjunto
      description: |
        Lê a planilha preenchida e devolve as linhas para o cliente usá-las no conjunto. **Não cria
        requisição.** Só o **primeiro** arquivo do multipart é lido (o nome do campo não importa).

        Sem arquivo: HTTP 406 em texto puro ("Nenhum arquivo enviado."). Erros parciais (linhas
        inválidas) voltam com **HTTP 200** dentro de `MensagensErro`; o cliente deve olhar
        `MensagensErro` mesmo com 200.
      operationId: uploadPlanilha
      x-source-controller: CardapioController.UploadPlanilha
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID do item de cardápio
        - name: chaveConjunto
          in: path
          required: true
          schema:
            type: string
          description: Chave do conjunto de dados adicionais
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Linhas lidas (e erros parciais em `MensagensErro`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  MensagensErro:
                    type: array
                    items:
                      type: string
                  Dados:
                    type: array
                    description: Matriz de linhas por células
                    items:
                      type: array
                      items:
                        type: string
              example:
                MensagensErro: []
                Dados:
                  - ["Maria", "11999999999"]
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/cardapio/categorias:
    get:
      tags: [Catálogo]
      summary: Listar categorias
      description: |
        Retorna as categorias de formulários filtradas pelos grupos de acesso do usuário, como **array
        cru** (sem envelope). `Itens` é `null` (não lista vazia) quando a categoria não tem itens. Para
        a versão com tags e categorias inferidas use `GET /v1/cardapio/portal`.
      operationId: categorias
      x-source-controller: CardapioController.Categorias
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoriaCardapioVM'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/cardapio/portal:
    get:
      tags: [Catálogo]
      summary: Categorias do portal
      description: |
        Retorna categorias do catálogo de serviços filtradas pelos grupos de acesso
        do usuário autenticado, enriquecidas com metadados de tags e sessões de
        navegação. Inclui categorias explícitas e inferidas. Recomendado para
        portais e navegação self-service.

        **Breaking change:** O campo `Id` é string (não integer). Categorias
        inferidas usam IDs compostos `"idCategoria-idSessao"`.
      operationId: portalCategorias
      x-source-controller: CardapioController.Portal
      responses:
        '200':
          description: Categorias do portal filtradas por grupos de acesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  _metadata:
                    $ref: '#/components/schemas/Metadata'
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        Id:
                          type: string
                          description: "Explícitas: Id numérico como string. Inferidas: 'idCategoria-idSessao'"
                          example: "1"
                        Nome:
                          type: string
                          example: "Suporte de TI"
                        Imagem:
                          type: string
                          nullable: true
                        Tipo:
                          type: string
                          enum: [explicita, inferida]
                          example: "explicita"
                        Favorito:
                          type: boolean
                          example: false
                        Tags:
                          type: array
                          items:
                            type: string
                          example: ["tag_3", "tag_7"]
                        NomesTags:
                          type: array
                          items:
                            type: string
                          example: ["Infraestrutura", "Hardware"]
                        Itens:
                          type: array
                          items:
                            type: object
                            properties:
                              Id:
                                type: integer
                                format: int64
                              Nome:
                                type: string
                              URL:
                                type: string
              example:
                _metadata:
                  Release: "9.8.0"
                  LogAmigavel:
                    - "Buscando grupos de acesso do usuário"
                    - "Buscando categorias explícitas"
                    - "Buscando categorias inferidas"
                    - "Buscando tags de navegação"
                    - "Enriquecendo categorias com metadados de tags"
                  MensagensErro: []
                records:
                  - Id: "1"
                    Nome: "Suporte de TI"
                    Imagem: null
                    Tipo: "explicita"
                    Favorito: false
                    Tags: ["tag_3", "tag_7"]
                    NomesTags: ["Infraestrutura", "Hardware"]
                    Itens:
                      - Id: 101
                        Nome: "Solicitação de Suporte de PC"
                        URL: "https://sua-empresa.bdesk.com.br/askrest/v1/cardapio/101"
                  - Id: "12-5"
                    Nome: "Categoria Inferida X"
                    Imagem: null
                    Tipo: "inferida"
                    Favorito: false
                    Tags: ["sessao_2"]
                    NomesTags: ["Processos Internos"]
                    Itens: []
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/cardapio/formularios/{formulario}:
    get:
      tags: [Catálogo]
      summary: Detalhes do formulário
      description: |
        Retorna detalhes de um formulário com conjuntos de campos (atividade não escolhida), como
        objeto cru (sem envelope). O campo `Id` nunca é preenchido (sempre `0`). As URLs de
        sub-recursos são absolutas e sempre `https://`.

        Erros são **HTTP 403** (não 406), com as mensagens em texto puro: formulário inexistente ou
        mensagens acumuladas na montagem dos dados.
      operationId: formulario
      x-source-controller: CardapioController.Formulario
      parameters:
        - name: formulario
          in: path
          required: true
          schema:
            type: integer
          description: ID do formulário
      responses:
        '200':
          description: Detalhes do formulário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormularioVM'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '403':
          description: Formulário inexistente ou erro ao montar os dados (corpo `text/plain`)

  /v1/cardapio/formularios/{formulario}/atividades:
    get:
      tags: [Catálogo]
      summary: Atividades do formulário
      description: |
        Lista as atividades disponíveis para o formulário, como **array cru** (sem envelope).
        `Categoria` e `SubCategoria` trazem só o `Id`. A atividade escolhida entra na abertura como
        `Atividade` do corpo.
      operationId: atividades
      x-source-controller: CardapioController.Atividades
      parameters:
        - name: formulario
          in: path
          required: true
          schema:
            type: integer
          description: ID do formulário
      responses:
        '200':
          description: Lista de atividades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AtividadeListItem'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/cardapio/formularios/{formulario}/atividades/{atividade}:
    get:
      tags: [Catálogo]
      summary: Detalhes da atividade
      description: |
        Retorna os campos e conjuntos de uma atividade específica (objeto cru). Não expõe
        `MensagensErro`: mensagens acumuladas ficam sem aparecer. É menos enxuto que
        `GET /v1/cardapio/{id}`: não traz `CondicoesDadosAdicionais`, `RegrasDataDadosAdicionais` nem
        `MensagemFinal`.
      operationId: atividade
      x-source-controller: CardapioController.Atividade
      parameters:
        - name: formulario
          in: path
          required: true
          schema:
            type: integer
          description: ID do formulário
        - name: atividade
          in: path
          required: true
          schema:
            type: integer
          description: ID da atividade
      responses:
        '200':
          description: Detalhes da atividade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DadosDoFormulario'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/itensselecao/{idDad}:
    get:
      tags: [Catálogo]
      summary: Itens de seleção por dado adicional
      description: |
        Retorna os valores **ativos** do domínio de um dado adicional, ordenados por texto, sem filtrar
        por pai. Para domínios em cascata use a rota com `{idDominioPai}`. Dado adicional inexistente
        ou sem itens: `records: []`. O controller inteiro é oculto do Swagger, mas as rotas são públicas.
      operationId: obterDominio
      x-source-controller: ItensSelecaoController.ObterDominio
      parameters:
        - name: idDad
          in: path
          required: true
          schema:
            type: integer
          description: ID do dado adicional
      responses:
        '200':
          description: Valores de domínio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestValor'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/itensselecao/{idDad}/{idDominioPai}:
    get:
      tags: [Catálogo]
      summary: Itens de seleção com filtro de domínio pai
      description: |
        Retorna os valores ativos do domínio filtrados pelo item pai (`idDomPai = idDominioPai`). Usada
        pelos campos dependentes (combo filho). Sem itens: `records: []`.
      operationId: obterDominioComPai
      x-source-controller: ItensSelecaoController.ObterDominio
      parameters:
        - name: idDad
          in: path
          required: true
          schema:
            type: integer
          description: ID do dado adicional
        - name: idDominioPai
          in: path
          required: true
          schema:
            type: integer
          description: ID do item pai
      responses:
        '200':
          description: Valores de domínio filtrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestValor'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/itensselecao/ObterDominio:
    get:
      tags: [Catálogo]
      summary: Itens de seleção (query params)
      description: |
        Variante por query string, o endereço que o cardápio entrega em `Opcoes.Dependencia.URL`
        (`.../itensselecao/ObterDominio?idDad=<n>&idDominioPai=idDominioPai`, em que o cliente troca o
        texto `idDominioPai` pelo id do pai). `idDominio` é, na prática, o id do item **pai**.

        Atenção: pelo roteamento, esta URL pode ser atendida pelas rotas de path
        (`{idDad}` e `{idDad}/{idDominioPai}`). Se o filtro por pai não se comportar como esperado,
        prefira `GET /v1/itensselecao/{idDad}/{idDominioPai}`. `idDad` ou `idDominio` ausentes
        podem responder 404 (seleção de ação do Web API).
      operationId: obterDominioParaCardapio
      x-source-controller: ItensSelecaoController.ObterDominioParaCarapio
      parameters:
        - name: idDad
          in: query
          required: true
          schema:
            type: integer
        - name: idDominio
          in: query
          required: true
          schema:
            type: integer
          description: ID do item pai
      responses:
        '200':
          description: Valores de domínio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestValor'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  # --------------------------------------------------------------------------
  # Configuração — IcsController, ConsultasController, ListasPapeisIcController
  # --------------------------------------------------------------------------

  /v1/ics:
    get:
      tags: [Configuração]
      summary: Listar itens de configuração
      description: |
        Retorna **todos** os ICs do ambiente em uma única resposta, **sem paginação, sem limite e sem
        filtro**; em ambientes grandes a resposta é pesada. O `_metadata` sai com `Release`,
        `LogAmigavel` e `MensagensErro` nulos. Cada IC traz as URLs (`https`) de `Relacoes`, `Detalhes`,
        `Componentes`, `Associacoes`, `Usuarios`, `Relacionamentos` e `ListasPapeis`. O controller é
        oculto do Swagger, mas as rotas são públicas.
      operationId: dashboardIcs
      x-source-controller: IcsController.Dashboard
      responses:
        '200':
          description: Lista de ICs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestIcVM'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/ics/{ic}:
    get:
      tags: [Configuração]
      summary: Detalhes do IC
      description: |
        Retorna os campos do IC mais os dados adicionais dele, como objeto cru (sem envelope).
        **Atenção:** a chave do link das relações se chama `Ralacoes` (erro de grafia no código); não
        existe `Relacoes` neste objeto (na listagem `GET /v1/ics` a chave é `Relacoes`). Cada dado
        adicional vira uma chave (o nome passa por um tratamento que remove espaços e os caracteres
        `ç`, `õ` e `á`; uma chave já existente nunca é sobrescrita, então um dado chamado "Nome" é
        descartado). IC inexistente pode resultar em HTTP 500.
      operationId: ic
      x-source-controller: IcsController.Ic
      parameters:
        - $ref: '#/components/parameters/IcId'
      responses:
        '200':
          description: Detalhes do IC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IcDetalhe'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/ics/{ic}/componentes:
    get:
      tags: [Configuração]
      summary: Componentes do IC
      description: |
        Lista os componentes (peças) do IC. O `_metadata` é um objeto vazio (`{}`). Não valida que o IC
        existe; IC sem componentes devolve `records: []`.
      operationId: componentesIc
      x-source-controller: IcsController.Componentes
      parameters:
        - $ref: '#/components/parameters/IcId'
      responses:
        '200':
          description: Componentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestGenerico'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/ics/{ic}/associacoes:
    get:
      tags: [Configuração]
      summary: Associações do IC
      description: |
        Lista os ICs associados a este IC (relação IC-IC). Diferente de "componentes" (peças) e de
        "relacionamentos" (árvore). O `_metadata` é um objeto vazio (`{}`).
      operationId: associacoesIc
      x-source-controller: IcsController.Associacoes
      parameters:
        - $ref: '#/components/parameters/IcId'
      responses:
        '200':
          description: Associações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestGenerico'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/ics/{ic}/relacoes:
    get:
      tags: [Configuração]
      summary: Relações do IC
      description: |
        Agrega usuários, componentes e associações do IC em uma chamada. Objeto cru, sem `_metadata`
        nem `records`.
      operationId: relacoesIc
      x-source-controller: IcsController.Relacoes
      parameters:
        - $ref: '#/components/parameters/IcId'
      responses:
        '200':
          description: Relações
          content:
            application/json:
              schema:
                type: object
                properties:
                  Usuarios:
                    type: array
                    items:
                      type: object
                  Componentes:
                    type: array
                    items:
                      type: object
                  Associacoes:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/ics/{ic}/usuarios:
    get:
      tags: [Configuração]
      summary: Usuários do IC
      description: |
        Lista os usuários vinculados ao IC pelo cadastro dele (não confundir com os membros das listas
        de papéis). O `_metadata` é um objeto vazio (`{}`).
      operationId: usuariosIc
      x-source-controller: IcsController.Usuarios
      parameters:
        - $ref: '#/components/parameters/IcId'
      responses:
        '200':
          description: Usuários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestGenerico'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/ics/{ic}/relacionamentos:
    get:
      tags: [Configuração]
      summary: Relacionamentos do IC
      description: |
        Retorna a árvore de dependências do IC até `nivel` níveis; `IdPai` permite remontar a árvore no
        cliente. Atenção à caixa: o campo `idPatRel` sai com inicial minúscula. O `_metadata` é um
        objeto vazio (`{}`).
      operationId: relacionamentosIc
      x-source-controller: IcsController.Relacionamentos
      parameters:
        - $ref: '#/components/parameters/IcId'
        - name: nivel
          in: query
          required: false
          schema:
            type: integer
            default: 3
          description: Profundidade máxima da árvore (sem validação)
      responses:
        '200':
          description: Árvore de relacionamentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestGenerico'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/ics/{ic}/listaspapeis:
    get:
      tags: [Configuração]
      summary: Listas de papéis do IC
      description: |
        Lista as listas de papéis ligadas ao IC. `Detalhes` e `Membros` são as URLs (`https`) das rotas
        seguintes. O catálogo geral de listas está em `GET /v1/listaspapeisic`. O `_metadata` é um
        objeto vazio (`{}`).
      operationId: listasPapeisDoIc
      x-source-controller: IcsController.ListasPapeisDoIc
      parameters:
        - $ref: '#/components/parameters/IcId'
      responses:
        '200':
          description: Listas de papéis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestGenerico'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/ics/{ic}/listaspapeis/{lista}:
    get:
      tags: [Configuração]
      summary: Dados de uma lista de papéis do IC
      description: |
        Retorna `Id`, `Nome`, `QuemCriou`, `QuemAlterou` (pode vir com campos nulos) e a URL dos
        membros, como objeto cru. Lista inexistente para o IC pode resultar em HTTP 500.
      operationId: dadosDaListaDoIc
      x-source-controller: IcsController.DadosDaListaDoIc
      parameters:
        - $ref: '#/components/parameters/IcId'
        - $ref: '#/components/parameters/ListaId'
      responses:
        '200':
          description: Dados da lista
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/ics/{ic}/listaspapeis/{lista}/membros:
    get:
      tags: [Configuração]
      summary: Membros de uma lista de papéis
      description: |
        Lista os membros da lista. `Nome` é o **nome de exibição** do usuário (`Usuario.nmUsu`), a mesma
        chave que o `POST` desta rota usa para inserir e remover. O `_metadata` é um objeto vazio (`{}`).
      operationId: membrosDaListaDoIc
      x-source-controller: IcsController.MembrosDaListaDoIc
      parameters:
        - $ref: '#/components/parameters/IcId'
        - $ref: '#/components/parameters/ListaId'
      responses:
        '200':
          description: Membros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestGenerico'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
    post:
      tags: [Configuração]
      summary: Alterar membros de uma lista de papéis
      description: |
        Insere e remove membros da lista. Cada string de `Inserir` e `Remover` é o **nome de exibição**
        do usuário (`Usuario.nmUsu`), **não** o login nem o id. A remoção casa o nome exato em memória
        (sensível a caixa); a inserção busca o usuário por nome. `Remover` é processado antes de
        `Inserir`.

        **Esta rota nunca devolve 406.** Nome sem correspondência não é erro: volta com HTTP 200 e
        `Resultado: "Não encontrado"` para aquele nome. A resposta lista o resultado por nome
        (`"Removido"`, `"Inserido"` ou `"Não encontrado"`); omitir `Remover` (ou `Inserir`) faz a chave
        voltar `null`. Inserir quem já é membro duplica a linha; usuários inativos não são filtrados.
        Corpo ausente ou vazio pode resultar em HTTP 500.
      operationId: alterarMembrosDaListaDoIc
      x-source-controller: IcsController.AlterarMembrosDaListaDoIc
      parameters:
        - $ref: '#/components/parameters/IcId'
        - $ref: '#/components/parameters/ListaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlteracoesMembros'
            example:
              Inserir: ["Maria Silva"]
              Remover: ["João Souza"]
      responses:
        '200':
          description: Resultado por nome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoAlteracoesMembros'
              example:
                Remover:
                  - { Nome: "João Souza", Resultado: "Removido" }
                Inserir:
                  - { Nome: "Maria Silva", Resultado: "Inserido" }
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /v1/consultas/{nome_consulta}:
    post:
      tags: [Configuração]
      summary: Executar consulta dinâmica
      description: |
        Executa uma consulta SQL pré-definida no `ParametroAvancado` `ConsultaSQLAPI/{nome_consulta}`,
        no formato `{ "Query": "<SQL>", "ParametrosInternos": ["UsuarioId"] }`. O contrato de cada
        consulta (parâmetros e colunas) é de cada ambiente, não da API.

        O corpo precisa ser um **objeto** JSON `{}` cujas propriedades são os parâmetros SQL. Todo
        valor é convertido para **texto** antes de ir ao SQL. Os nomes em `ParametrosInternos` (hoje
        só `UsuarioId`) são preenchidos pelo servidor e **não podem** ser enviados pelo cliente.

        A resposta tem uma entrada em `records` por conjunto de resultados da consulta, cada uma uma
        lista de linhas (objetos coluna-valor). Erros são **HTTP 406 em texto puro**: consulta não
        configurada, JSON inválido, corpo que não é objeto (inclui corpo vazio: "O JSON informado deve
        ser um objeto como {}"), `Query` vazia e parâmetro interno enviado pelo cliente.
      operationId: executarQuery
      x-source-controller: ConsultasController.ExecutarQuery
      parameters:
        - name: nome_consulta
          in: path
          required: true
          schema:
            type: string
          description: Nome da consulta registrada em ParametroAvancado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Parâmetros SQL como pares chave-valor (o prefixo `@` é opcional)
            example:
              "@status": "Aberta"
      responses:
        '200':
          description: Resultados da consulta (uma lista de linhas por conjunto de resultados)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestGenerico'
              example:
                _metadata: { Release: "9.8.0", LogAmigavel: [], MensagensErro: [] }
                records:
                  - [ { idReq: 1, dsTitulo: "x" } ]
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '406':
          $ref: '#/components/responses/ErroNegocio'

  /v1/listaspapeisic:
    get:
      tags: [Configuração]
      summary: Listar todas as listas de papéis de IC
      description: |
        Retorna o catálogo geral de listas de papéis de IC **ativas** (não por IC; as listas de um IC
        estão em `GET /v1/ics/{ic}/listaspapeis`). O `_metadata` sai com valores nulos. `QuemAlterou`
        vem com campos nulos quando a lista nunca foi alterada. O controller é oculto do Swagger, mas a
        rota é pública.
      operationId: listasDePapeisIc
      x-source-controller: ListasPapeisIcController.ListasDePapeisIc
      responses:
        '200':
          description: Listas de papéis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetornoApiRestListaIcVM'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  # --------------------------------------------------------------------------
  # Notificações e Push — NotificacoesApiController, PushApiController (internos)
  # --------------------------------------------------------------------------

# ============================================================================
# COMPONENTS
# ============================================================================

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token obtido via POST /v1/login/entrar. O servidor não expira o token; vale enquanto o usuário estiver ativo

  # --- Reusable Parameters ---

  parameters:
    RequisicaoId:
      name: requisicao
      in: path
      required: true
      schema:
        type: integer
      description: ID da requisição
    IcId:
      name: ic
      in: path
      required: true
      schema:
        type: integer
      description: ID do item de configuração
    ListaId:
      name: lista
      in: path
      required: true
      schema:
        type: integer
      description: ID da lista de papéis

    DebugRetornarJson:
      name: Debug
      in: header
      required: false
      schema:
        type: string
        enum: [RetornarJson]
      description: Com o valor `RetornarJson` a rota não grava nada e devolve o que interpretou do corpo (modo de depuração)

    FiltroRequisicaoId:
      name: RequisicaoId
      in: query
      required: false
      schema:
        type: integer
      description: Número da requisição

    FiltroAtividadeId:
      name: AtividadeId
      in: query
      required: false
      schema:
        type: integer
      description: Id da atividade

    FiltroAtividadesIds:
      name: AtividadesIds
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
      description: Ids de atividades (repita o parâmetro para vários valores)

    FiltroNomeAtividade:
      name: NomeAtividade
      in: query
      required: false
      schema:
        type: string
      description: Nome da atividade (busca por trecho, `LIKE %x%`)

    FiltroNomeFormulario:
      name: NomeFormulario
      in: query
      required: false
      schema:
        type: string
      description: Nome do formulário (busca por trecho, `LIKE %x%`)

    FiltroDescricoesStatus:
      name: DescricoesStatus
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      description: Descrições de status (`IN`; repita o parâmetro para vários valores)

    FiltroGruposSolucionadores:
      name: GruposSolucionadores
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
      description: Ids dos grupos solucionadores atuais (`IN`)

    FiltroIdsFormularios:
      name: IdsFormularios
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
      description: Ids de formulários (`IN`)

    FiltroAssunto:
      name: Assunto
      in: query
      required: false
      schema:
        type: string
      description: Assunto da requisição (igualdade exata)

    FiltroAbertoEntreInicio:
      name: AbertoEntre.Inicio
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Início do intervalo de abertura

    FiltroAbertoEntreFim:
      name: AbertoEntre.Fim
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Fim do intervalo de abertura

    FiltroEncerradoEntreInicio:
      name: EncerradoEntre.Inicio
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Início do intervalo de encerramento

    FiltroEncerradoEntreFim:
      name: EncerradoEntre.Fim
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Fim do intervalo de encerramento

    FiltroLimiteRequisicoes:
      name: LimiteRequisicoes
      in: query
      required: false
      schema:
        type: integer
        default: 500
      description: Máximo de requisições devolvidas (único limitador; não há paginação)

  # --- Reusable Responses ---

  responses:
    NaoAutorizado:
      description: |
        Não autorizado (HTTP 401, sem corpo): cabeçalho `Authorization` ausente, esquema diferente de
        Bearer, token desconhecido ou usuário inativo. O servidor devolve `WWW-Authenticate: Basic realm="<host>"`.

    ErroNegocio:
      description: |
        Erro de negócio (HTTP 406). O corpo é **texto puro** (`text/plain`, `ReasonPhrase` "Critical
        Exception"), com as mensagens separadas por quebra de linha. **Não é JSON** e não tem
        `_metadata`. Em outros endpoints o erro de negócio volta com HTTP 200 e a mensagem no corpo;
        veja a descrição de cada operação.
      content:
        text/plain:
          schema:
            type: string
          example: "Requisição inexistente ou usuário sem acesso"

    ErroInterno:
      description: Exceção não tratada (HTTP 500). O ASP.NET devolve o corpo com `ExceptionMessage` e `StackTrace`
      content:
        application/json:
          schema:
            type: object
            properties:
              Message:
                type: string
              ExceptionMessage:
                type: string

  # --- Schemas ---

  schemas:

    # --- Envelopes de Resposta ---

    Metadata:
      type: object
      properties:
        Release:
          type: string
        MensagensErro:
          type: array
          items:
            type: string
        LogAmigavel:
          type: array
          items: {}

    RetornoApiLogin:
      type: object
      description: |
        Envelope de resposta do login (RetornoApi<T>).
        **Atenção:** `Dados` é uma string JSON escapada, não um objeto direto. Em falha, `Dados` é
        nulo e `MensagensErro` traz o motivo (o status continua 200).
      properties:
        Dados:
          type: string
          nullable: true
          description: String JSON escapada contendo o token (`access_token`, `token_type`, `expires_in`, ...). Requer JSON.parse() para extrair. Nulo em falha.
        LogAmigavel:
          type: array
          items: {}
        MensagensErro:
          type: array
          items:
            type: string
        Versao:
          type: string
          nullable: true

    RetornoApiObject:
      type: object
      description: Envelope RetornoApi<object>. Em falha, `Dados` é nulo e `MensagensErro` traz o motivo (status 200).
      properties:
        Dados:
          type: object
          nullable: true
        LogAmigavel:
          type: array
          items: {}
        MensagensErro:
          type: array
          items:
            type: string
        Versao:
          type: string

    RetornoApiRestGenerico:
      type: object
      description: Envelope padrão RetornoApiRest<T> com records genéricos.
      properties:
        _metadata:
          $ref: '#/components/schemas/Metadata'
        records:
          type: array
          items: {}

    RetornoApiRestString:
      type: object
      properties:
        _metadata:
          $ref: '#/components/schemas/Metadata'
        records:
          type: array
          items:
            type: string

    RetornoApiRestRequisicoes:
      type: object
      description: Lista de requisições. O `_metadata` desta lista só traz `MensagensErro` e `LogAmigavel`.
      properties:
        _metadata:
          $ref: '#/components/schemas/Metadata'
        records:
          type: array
          items:
            $ref: '#/components/schemas/RequisicaoListItem'

    RetornoApiRestPerfilUsuario:
      type: object
      properties:
        _metadata:
          $ref: '#/components/schemas/Metadata'
        records:
          type: array
          description: Um único record (vazio se o usuário não for encontrado)
          items:
            type: object
            properties:
              UsuarioId:
                type: integer
                format: int64
              Login:
                type: string
              Dominio:
                type: string
                nullable: true
              Nome:
                type: string
              Ramal:
                type: string
                nullable: true
              Email:
                type: string
                nullable: true
              PerfilId:
                type: integer
              PerfilNome:
                type: string
                nullable: true
              Estacao:
                type: string
                nullable: true
              Matricula:
                type: string
                nullable: true
              Fone:
                type: string
                nullable: true
              Celular:
                type: string
                nullable: true
              CPF:
                type: string
                nullable: true
              EmpresaId:
                type: integer
                nullable: true
              EmpresaCNPJ:
                type: string
                nullable: true
              EmpresaNome:
                type: string
                nullable: true
              CargoId:
                type: integer
                nullable: true
              CargoNome:
                type: string
                nullable: true
              SuperiorHierarquicoId:
                type: integer
                nullable: true
              SuperiorHierarquicoNome:
                type: string
                nullable: true
              SuperiorHierarquicoEmail:
                type: string
                nullable: true
              SuperiorAlternativoId:
                type: integer
                nullable: true
              SuperiorAlternativoNome:
                type: string
                nullable: true
              SuperiorAlternativoEmail:
                type: string
                nullable: true
              Cliente:
                type: boolean
                nullable: true
              Fornecedor:
                type: boolean
                nullable: true

    RetornoApiRestAreaVM:
      type: object
      properties:
        _metadata:
          $ref: '#/components/schemas/Metadata'
        records:
          type: array
          items:
            $ref: '#/components/schemas/AreaVM'

    RetornoApiRestIcVM:
      type: object
      properties:
        _metadata:
          $ref: '#/components/schemas/Metadata'
        records:
          type: array
          items:
            $ref: '#/components/schemas/IcVM'

    RetornoApiRestValor:
      type: object
